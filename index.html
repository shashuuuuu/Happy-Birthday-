<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Babuu</title>
<style>
:root{
  --bg1:#ffe3ec; --bg2:#ffc2d6; --text:#7a1237; --card:#ffffffd9; --heart:#ff3d71; --hint:#b0486b;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2a0f1a; --bg2:#4a1730; --text:#ffd6e4; --card:#3a1626d9; --heart:#ff5c8a; --hint:#e79ab5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#2a0f1a; --bg2:#4a1730; --text:#ffd6e4; --card:#3a1626d9; --heart:#ff5c8a; --hint:#e79ab5;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--text);
  font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;text-align:center;
}
#stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column}
#heart{
  font-size:min(42vw,200px);line-height:1;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  background:none;border:0;padding:0;
  animation:fly 1.6s cubic-bezier(.2,1.2,.4,1) both, beat 1.1s 1.6s ease-in-out infinite;
  filter:drop-shadow(0 10px 18px rgba(255,61,113,.45));
}
@keyframes fly{from{transform:translateY(120vh) rotate(-30deg) scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
#hint{margin-top:18px;color:var(--hint);font-size:1.05rem;animation:fade 1s 1.8s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
#heart.pop{animation:pop .6s ease-in forwards}
@keyframes pop{to{transform:scale(6);opacity:0}}
#wish{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;
}
#wish.show{display:flex}
.card{
  background:var(--card);border-radius:28px;padding:34px 26px;max-width:340px;
  box-shadow:0 18px 50px rgba(255,61,113,.3);
  animation:rise .9s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes rise{from{transform:scale(.4) translateY(40px);opacity:0}to{transform:none;opacity:1}}
.cake{font-size:3.2rem}
h1{margin:8px 0 4px;font-size:2.1rem;line-height:1.15;color:var(--heart)}
h2{margin:0;font-size:2.6rem;letter-spacing:1px}
p{margin:14px 0 0;font-size:1.05rem}
button.again{margin-top:20px;background:var(--heart);color:#fff;border:0;border-radius:99px;padding:10px 22px;font-size:1rem;cursor:pointer}
.bit{position:fixed;top:-30px;pointer-events:none;z-index:5;animation:drop linear forwards}
@keyframes drop{to{transform:translateY(115vh) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){#heart{animation:none}.bit{display:none}}
</style>
</head>
<body>
<div id="stage">
  <button id="heart" aria-label="Open your birthday wish">&#10084;&#65039;</button>
  <div id="hint">Tap the heart &#128150;</div>
  <div id="wish" aria-live="polite">
    <div class="card">
      <div class="cake">&#127874;</div>
      <h1>Happy Birthday</h1>
      <h2>Babuu &#128149;</h2>
      <p>Wishing you a day full of love, laughter and all your favourite things.</p>
      <button class="again" id="again">Close &#128140;</button>
    </div>
  </div>
</div>
<script>
var heart=document.getElementById('heart'),hint=document.getElementById('hint'),
    wish=document.getElementById('wish'),again=document.getElementById('again');
var bits=['\u2764\uFE0F','\uD83D\uDC96','\uD83C\uDF89','\u2728','\uD83C\uDF88','\uD83D\uDC95'];
function rain(n){
  for(var i=0;i<n;i++){
    var s=document.createElement('span');
    s.className='bit';
    s.textContent=bits[Math.floor(Math.random()*bits.length)];
    s.style.left=Math.random()*100+'vw';
    s.style.fontSize=(16+Math.random()*22)+'px';
    s.style.animationDuration=(2.5+Math.random()*3)+'s';
    s.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(s);
    setTimeout(function(el){el.remove()}.bind(null,s),7000);
  }
}
heart.addEventListener('click',function(){
  heart.classList.add('pop');hint.style.display='none';
  setTimeout(function(){wish.classList.add('show');heart.style.display='none';rain(40)},450);
});
again.addEventListener('click',function(){
  wish.classList.remove('show');
  heart.style.display='';heart.classList.remove('pop');
  heart.style.animation='none';void heart.offsetWidth;heart.style.animation='';
  hint.style.display='';
});
</script>
</body>
</html>
